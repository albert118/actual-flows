bug:
    - head-branch: ['^bug']

documentation:
    - changed-files:
          - any-glob-to-any-file: ['**/*.md']

housekeeping:
    - changed-files:
          - any-glob-to-any-file: ['.gitignore', '.gitattributes', '.editorconfig', '.node-version', 'LICENSE']

infrastructure:
    - changed-files:
          - any-glob-to-any-file: ['Dockerfile*', '.dockerignore', 'docker-compose*.yml', '.github/**']

enhancement:
    - changed-files:
          - any-glob-to-any-file: ['src/**']

tests:
    - changed-files:
          - any-glob-to-any-file: ['test/**']

dependencies:
    - changed-files:
          - any-glob-to-any-file: ['package.json', 'package-lock.json']
