version: 2
updates:
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'sunday'
          time: '16:00'
      groups:
          npm-dependencies:
              update-types:
                  - 'minor'
                  - 'patch'

    - package-ecosystem: 'docker'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'sunday'
          time: '16:00'
      ignore:
          - dependency-name: 'node'
            update-types:
                - 'version-update:semver-major'

    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'sunday'
          time: '16:00'
      groups:
          github-actions:
              update-types:
                  - 'minor'
                  - 'patch'
