name: Docker

on:
    pull_request:

permissions:
    contents: read

jobs:
    image:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Build image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/amd64
                  load: true
                  push: false
                  tags: actual-flows:smoke
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Smoke test image
              run: |
                  docker run --rm actual-flows:smoke node src/cli.js --help
                  uid="$(docker run --rm actual-flows:smoke id -u)"
                  if [ "$uid" = "0" ]; then
                      echo "Image runs as root" >&2
                      exit 1
                  fi
                  docker run --rm actual-flows:smoke node --input-type=module -e "
                      const { default: Database } = await import('better-sqlite3');
                      if (new Database(':memory:').prepare('select 1 as x').get().x !== 1) process.exit(1);
                  "
