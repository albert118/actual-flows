name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    ci:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version
                  cache: npm

            - name: Check Dockerfile Node matches .node-version
              run: |
                  expected="$(tr -d '[:space:]' < .node-version)"
                  expected="${expected%%.*}"
                  status=0
                  for actual in $(sed -n 's/^FROM node:\([0-9]*\).*/\1/p' Dockerfile); do
                      if [ "$actual" != "$expected" ]; then
                          echo "Dockerfile uses Node '$actual' but .node-version is '$expected'" >&2
                          status=1
                      fi
                  done
                  exit "$status"

            - name: Install dependencies
              run: npm ci --no-audit --no-fund

            - name: Test
              run: npm test
