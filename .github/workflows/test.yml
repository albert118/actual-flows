name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The test job must be base-agnostic: branches without a Node project
      # (e.g. infra-only branches with no package-lock.json) should skip
      # cleanly rather than fail `cache: npm`. Only run the JS pipeline when
      # a lockfile is present.
      - name: Detect Node lockfile
        id: lockfile
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.lockfile.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.lockfile.outputs.found == 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Run tests
        if: steps.lockfile.outputs.found == 'true'
        run: npm test